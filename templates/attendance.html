{% extends "base.html" %}

{% block title %}Attendance - Visma{% endblock %}

{% block content %}
<div class="page-container">
    <header class="page-header">
        <div class="header-content">
            <a href="{{ url_for('index') }}" class="back-btn">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Back
            </a>
            <h1 class="page-title">Attendance</h1>
            <div class="header-controls">
                <!-- Tab Switcher -->
                <div class="tab-switcher">
                    <button id="tabMark" class="tab-btn active" onclick="showPanel('mark')">Mark Attendance</button>
                    <button id="tabSummary" class="tab-btn" onclick="showPanel('summary')">View Summary</button>
                </div>
                <!-- Mark Attendance Controls -->
                <div id="markControls" class="control-group">
                    <span id="progressCounter" class="progress-counter"></span>
                    <input type="date" id="dateInput" class="date-input">
                    <button id="addLabourBtn" class="btn btn-secondary">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="8.5" cy="7" r="4"/>
                            <line x1="20" y1="8" x2="20" y2="14"/>
                            <line x1="23" y1="11" x2="17" y2="11"/>
                        </svg>
                        Add Labour
                    </button>
                    <button id="saveBtn" class="btn btn-primary">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                            <polyline points="17 21 17 13 7 13 7 21"/>
                            <polyline points="7 3 7 8 15 8"/>
                        </svg>
                        Save All
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div id="message" class="message" style="display: none;"></div>

    <!-- Sliding Panels Container -->
    <div class="panels-wrapper">
        <div id="panelsContainer" class="panels-container">
            <!-- Panel 1: Mark Attendance -->
            <div id="panelMark" class="panel active">
                <main class="main-content">
                    <div id="workersContainer" class="workers-container">
                        <div class="loading">Loading labours...</div>
                    </div>
                </main>
            </div>

            <!-- Panel 2: Summary -->
            <div id="panelSummary" class="panel">
                <main class="main-content">
                    <div id="laboursContainer" class="labours-list">
                        <div class="loading">Loading labours...</div>
                    </div>
                </main>
            </div>
        </div>
    </div>
</div>

<!-- Add Labour Modal -->
<div id="addModal" class="modal" style="display: none;">
    <div class="modal-content modal-small">
        <div class="modal-header">
            <h2>Add New Labour</h2>
            <button class="close-btn" onclick="closeAddModal()">&times;</button>
        </div>
        <div class="modal-body">
            <form id="addLabourForm">
                <div class="form-group">
                    <label>Name *</label>
                    <input type="text" id="newName" required placeholder="Enter worker name">
                </div>
                <div class="form-group">
                    <label>Designation</label>
                    <select id="newDesignation">
                        <option value="">Select designation...</option>
                        <option value="FITTER">FITTER</option>
                        <option value="WELDER">WELDER</option>
                        <option value="HELPER">HELPER</option>
                        <option value="RIGGER">RIGGER</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Team</label>
                    <input type="text" id="newTeam" list="teamsList" placeholder="Select or type new team">
                    <datalist id="teamsList"></datalist>
                </div>
                <div class="form-group">
                    <label>Base Salary/Day</label>
                    <input type="number" id="newSalary" min="0" step="50" placeholder="Optional - set later">
                </div>
                <button type="submit" class="submit-btn">Add Labour</button>
            </form>
        </div>
    </div>
</div>

<!-- Labour History Modal -->
<div id="historyModal" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Labour History</h2>
            <button class="close-btn" onclick="closeHistoryModal()">&times;</button>
        </div>
        <div id="modalBody" class="modal-body">
            <div class="loading">Loading...</div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/attendance.js') }}"></script>
<script>
// Panel switching
let currentPanel = 'mark';
window.summaryLoaded = false;

function showPanel(panel) {
    if (panel === currentPanel) return;

    currentPanel = panel;
    const container = document.getElementById('panelsContainer');
    const tabMark = document.getElementById('tabMark');
    const tabSummary = document.getElementById('tabSummary');
    const markControls = document.getElementById('markControls');

    if (panel === 'mark') {
        container.style.transform = 'translateX(0)';
        tabMark.classList.add('active');
        tabSummary.classList.remove('active');
        markControls.style.display = 'flex';
    } else {
        container.style.transform = 'translateX(-50%)';
        tabMark.classList.remove('active');
        tabSummary.classList.add('active');
        markControls.style.display = 'none';

        // Load summary if not loaded or needs refresh
        if (!window.summaryLoaded) {
            loadLabours();
            window.summaryLoaded = true;
        }
    }
}

// Load labours for summary panel
async function loadLabours() {
    const container = document.getElementById('laboursContainer');

    try {
        const response = await fetch('/api/labours');
        const labours = await response.json();

        if (labours.length === 0) {
            container.innerHTML = '<div class="empty-state">No labours found. Import data first.</div>';
            return;
        }

        // Group by team
        const teams = {};
        labours.forEach(l => {
            const team = l.team || 'Unassigned';
            if (!teams[team]) teams[team] = [];
            teams[team].push(l);
        });

        let html = '';
        for (const [team, members] of Object.entries(teams)) {
            html += `
                <div class="team-section">
                    <h2 class="team-title">${team} <span class="count">(${members.length})</span></h2>
                    <div class="labour-cards">
                        ${members.map(l => `
                            <div class="labour-card" onclick="showHistory(${l.worker_id})">
                                <div class="labour-info">
                                    <h3 class="labour-name">${l.name}</h3>
                                    <p class="labour-designation">${l.designation || 'N/A'}</p>
                                </div>
                                <div class="labour-meta">
                                    <span class="last-attendance">Last: ${l.last_attendance || 'N/A'}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        container.innerHTML = html;

    } catch (error) {
        container.innerHTML = '<div class="error">Error loading data. Is the server running?</div>';
        console.error(error);
    }
}

// Show worker history modal
async function showHistory(workerId) {
    const modal = document.getElementById('historyModal');
    const title = document.getElementById('modalTitle');
    const body = document.getElementById('modalBody');

    modal.style.display = 'flex';
    title.textContent = 'Loading...';
    body.innerHTML = '<div class="loading">Loading history...</div>';

    try {
        const response = await fetch(`/api/labours/${workerId}/history`);
        const data = await response.json();

        // Group attendance by month
        const monthlyData = {};
        data.attendance.forEach(a => {
            const date = new Date(a.date);
            const monthKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
            if (!monthlyData[monthKey]) {
                monthlyData[monthKey] = {
                    records: [],
                    presentDays: 0,
                    absentDays: 0,
                    holidays: 0,
                    totalOT: 0
                };
            }
            monthlyData[monthKey].records.push(a);
            if (a.status === 'P') monthlyData[monthKey].presentDays++;
            else if (a.status === 'A') monthlyData[monthKey].absentDays++;
            else if (a.status === 'H') monthlyData[monthKey].holidays++;
            monthlyData[monthKey].totalOT += parseFloat(a.ot_hours) || 0;
        });

        const sortedMonths = Object.keys(monthlyData).sort().reverse();
        sortedMonths.forEach(monthKey => {
            monthlyData[monthKey].records.sort((a, b) => new Date(a.date) - new Date(b.date));
        });

        title.textContent = data.name;
        body.innerHTML = `
            <div class="worker-info-bar">
                <span class="info-chip"><strong>ID:</strong> ${data.worker_id}</span>
                <span class="info-chip"><strong>Designation:</strong> ${data.designation || 'N/A'}</span>
                <span class="info-chip"><strong>Team:</strong> ${data.team || 'N/A'}</span>
            </div>

            <div class="history-months">
                ${sortedMonths.map(monthKey => {
                    const month = monthlyData[monthKey];
                    const monthName = getMonthName(monthKey);
                    return `
                        <div class="history-month-section">
                            <div class="history-month-header">
                                <h3 class="history-month-title">${monthName}</h3>
                                <div class="month-stats">
                                    <span class="stat present">${month.presentDays}P</span>
                                    <span class="stat absent">${month.absentDays}A</span>
                                    <span class="stat holiday">${month.holidays}H</span>
                                    <span class="stat ot">${month.totalOT} OT</span>
                                </div>
                            </div>
                            <div class="calendar-grid">
                                ${month.records.map(a => {
                                    const day = new Date(a.date).getDate();
                                    return `
                                        <div class="day-cell ${a.status.toLowerCase()}" title="${a.date}${a.project ? ' - ' + a.project : ''}">
                                            <span class="day-num">${day}</span>
                                            <span class="day-status">${a.status}</span>
                                            ${a.ot_hours > 0 ? `<span class="day-ot">+${a.ot_hours}</span>` : ''}
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;
                }).join('')}
            </div>
        `;

    } catch (error) {
        body.innerHTML = '<div class="error">Error loading history.</div>';
        console.error(error);
    }
}

function getMonthName(monthKey) {
    const [year, month] = monthKey.split('-');
    const months = ['January', 'February', 'March', 'April', 'May', 'June',
                    'July', 'August', 'September', 'October', 'November', 'December'];
    return `${months[parseInt(month) - 1]} ${year}`;
}

function closeHistoryModal() {
    document.getElementById('historyModal').style.display = 'none';
}

document.getElementById('historyModal').addEventListener('click', function(e) {
    if (e.target === this) closeHistoryModal();
});
</script>
{% endblock %}
