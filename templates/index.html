{% extends "base.html" %}

{% block title %}Visma{% endblock %}

{% block content %}
<div class="landing-page">
    <div class="landing-content">
        <header class="landing-hero">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Visma" class="brand-logo">
            <h1 class="brand-name">VISMA</h1>
            <div class="brand-divider"></div>
            <p class="brand-subtitle">Attendance & Salary Management</p>
        </header>

        <nav class="module-nav">
            <a href="{{ url_for('attendance_page') }}" class="module-card">
                <div class="module-card-inner">
                    <div class="module-icon-wrap">
                        <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5"
                            viewBox="0 0 24 24">
                            <path
                                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                        </svg>
                    </div>
                    <div class="module-info">
                        <h2 class="module-name">Attendance</h2>
                        <p class="module-desc">Track daily attendance & overtime</p>
                    </div>
                    <div class="module-arrow">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                            viewBox="0 0 24 24">
                            <path d="M5 12h14M12 5l7 7-7 7" />
                        </svg>
                    </div>
                </div>
            </a>

            <a href="{{ url_for('salary_page') }}" class="module-card">
                <div class="module-card-inner">
                    <div class="module-icon-wrap">
                        <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5"
                            viewBox="0 0 24 24">
                            <path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6" />
                        </svg>
                    </div>
                    <div class="module-info">
                        <h2 class="module-name">Salary</h2>
                        <p class="module-desc">Calculate wages & export reports</p>
                    </div>
                    <div class="module-arrow">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                            viewBox="0 0 24 24">
                            <path d="M5 12h14M12 5l7 7-7 7" />
                        </svg>
                    </div>
                </div>
            </a>
        </nav>
    </div>

    <footer class="landing-footer">
        <p>Factory Worker Management System</p>
    </footer>
</div>
{% endblock %}
