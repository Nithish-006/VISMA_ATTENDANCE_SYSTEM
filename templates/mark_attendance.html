{% extends "base.html" %}

{% block title %}Mark Attendance - Visma{% endblock %}

{% block content %}
<div class="page-container">
    <header class="page-header">
        <div class="header-content">
            <a href="{{ url_for('attendance_page') }}" class="back-btn">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Back
            </a>
            <h1 class="page-title">Mark Attendance</h1>
            <div class="header-controls">
                <input type="date" id="dateInput" class="date-input">
                <button id="addLabourBtn" class="btn btn-secondary">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="8.5" cy="7" r="4"/>
                        <line x1="20" y1="8" x2="20" y2="14"/>
                        <line x1="23" y1="11" x2="17" y2="11"/>
                    </svg>
                    Add Labour
                </button>
                <button id="saveBtn" class="btn btn-primary">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                        <polyline points="17 21 17 13 7 13 7 21"/>
                        <polyline points="7 3 7 8 15 8"/>
                    </svg>
                    Save All
                </button>
            </div>
        </div>
    </header>

    <div id="message" class="message" style="display: none;"></div>

    <main class="main-content">
        <div id="workersContainer" class="workers-container">
            <div class="loading">Loading labours...</div>
        </div>
    </main>
</div>

<!-- Add Labour Modal -->
<div id="addModal" class="modal" style="display: none;">
    <div class="modal-content modal-small">
        <div class="modal-header">
            <h2>Add New Labour</h2>
            <button class="close-btn" onclick="closeAddModal()">&times;</button>
        </div>
        <div class="modal-body">
            <form id="addLabourForm">
                <div class="form-group">
                    <label>Name *</label>
                    <input type="text" id="newName" required placeholder="Enter worker name">
                </div>
                <div class="form-group">
                    <label>Designation</label>
                    <select id="newDesignation">
                        <option value="">Select designation...</option>
                        <option value="FITTER">FITTER</option>
                        <option value="WELDER">WELDER</option>
                        <option value="HELPER">HELPER</option>
                        <option value="RIGGER">RIGGER</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Team</label>
                    <input type="text" id="newTeam" list="teamsList" placeholder="Select or type new team">
                    <datalist id="teamsList"></datalist>
                </div>
                <div class="form-group">
                    <label>Base Salary/Day</label>
                    <input type="number" id="newSalary" min="0" step="50" placeholder="Optional - set later">
                </div>
                <button type="submit" class="submit-btn">Add Labour</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/attendance.js') }}"></script>
{% endblock %}
